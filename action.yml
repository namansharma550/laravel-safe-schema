name: 'Laravel Safe Migrations'
description: 'Lints Laravel migrations for operations that lock production tables unsafely.'
author: 'RG Infotech'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  php-version:
    description: 'PHP version to run the linter with.'
    required: false
    default: '8.3'
  path:
    description: 'Directory to scan for migration files.'
    required: false
    default: 'database/migrations'
  since:
    description: 'Only lint files changed since this git ref, e.g. origin/main. Leave empty to lint every migration.'
    required: false
    default: ''
  strict:
    description: 'Fail the workflow when violations are found.'
    required: false
    default: 'false'
  working-directory:
    description: 'Directory containing the Laravel application (its composer.json).'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install Composer dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Run migrate:lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ARGS="--path=${{ inputs.path }} --format=github"

        if [ -n "${{ inputs.since }}" ]; then
          ARGS="$ARGS --since=${{ inputs.since }}"
        fi

        if [ "${{ inputs.strict }}" = "true" ]; then
          ARGS="$ARGS --strict"
        fi

        php artisan migrate:lint $ARGS
